# Lokalna baza za razvoj:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: trgovacki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trgovacki
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - trgovacki-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trgovacki']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trgovacki-pgdata:
